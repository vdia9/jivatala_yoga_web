hero:
  focim: "Jīvatāla Yoga"
  alcim: "THE RHYTHM OF BEING"
  gomb_szoveg: "Órarend és jelentkezés"
  hatterkep: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1600&q=80" # Placeholder kép

yin_yoga:
  cim: "A Yin jógáról"
  szoveg_1: "Ide írd majd a Yin jóga lényegét. Ez a szöveg csak helykitöltő (placeholder), amely bemutatja, hogyan mutat majd a meleg, letisztult elrendezésben a leírásod."
  szoveg_2: "Második bekezdés helye: kinek ajánlott, milyen hatásai vannak a testre és az elmére, miért fontos a lelassulás."
  kep: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=80" # Placeholder kép

rolam:
  cim: "Rólam"
  szoveg_1: "Ide kerül a személyes bemutatkozásod. Mesélj arról, hogyan találtál rá a jógára, és mit jelent számodra a 'the rhythm of being' szemlélet."
  szoveg_2: "Képesítéseid, tapasztalataid és az a hangulat, amivel az óráidon várod a gyakorlókat."
  kep: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=800&q=80" # Placeholder portrékép

orarend:
  cim: "Órarend és Árak"
  bevezeto: "Válassz az online és személyes órák közül. Kattints az óra nevére a részletes leírásért!"
  jelentkezes_google_form_link: "https://docs.google.com/forms/" # Ide másold a jelentkezési Google Form linkjét!
  orak:
    - idopont: "Hétfő 18:00 – 19:15"
      tipus: "Személyes óra (Budapest, Stúdió neve)"
      nev: "Esti lelassulás – Yin Yoga"
      leiras: "Placeholder leírás: Ezen az órán a csípő és a gerinc körüli mélyebb szövetek lazítására fókuszálunk, lágy légzőgyakorlatokkal kísérve. Kezdőknek is ideális."
    - idopont: "Szerda 19:00 – 20:00"
      tipus: "Online (Zoom)"
      nev: "Otthoni csend – Yin & Relaxáció"
      leiras: "Placeholder leírás: Készíts be párnákat és egy takarót. A saját otthonod kényelméből hangolódhatsz át a pihenésre."
  arak:
    - megnevezes: "Alkalmi jegy (személyes)"
      ar: "4 500 Ft"
    - megnevezes: "Alkalmi jegy (online)"
      ar: "3 000 Ft"
    - megnevezes: "4 alkalmas bérlet"
      ar: "16 000 Ft"
  fizetesi_modok: "Előre utalással, Revoluton keresztül, vagy személyes óra előtt a helyszínen készpénzben."

kapcsolat:
  cim: "Kapcsolat és Visszajelzés"
  szoveg: "Kérdésed van az órákkal kapcsolatban, vagy szeretnél visszajelzést küldeni a közös gyakorlásról? Írj bátran!"
  email: "info@pelda-jivatayoga.hu"
  telefon: "+36 30 000 0000"
  instagram: "https://instagram.com"
  facebook: "https://facebook.com"
  feedback_google_form_link: "https://docs.google.com/forms/" # Ide másold a visszajelző Google Form linkjét!
